name: 功能建议
description: 提议一个明确、可维护的新能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下遇到了什么阻碍？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述期望的交互和最终结果，不必限定具体实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
  - type: textarea
    id: impact
    attributes:
      label: 兼容性与安全影响
      description: 是否涉及新权限、网络通信、后台服务、数据格式或命令执行？
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issues 和功能矩阵。
          required: true
        - label: 我愿意配合补充设计和验收场景。
          required: true