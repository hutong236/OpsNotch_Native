name: Apply desktop command candidate integration

on:
  push:
    branches:
      - fix/desktop-command-search-31
    paths:
      - .github/workflows/apply-desktop-command-candidate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/desktop-command-search-31
      - name: Patch unified search integration
        run: python3 .github/scripts/apply_desktop_command_candidate.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/OpsNotchApp/AppModel.swift Sources/OpsNotchApp/ShelfView.swift
          git commit -m "feat: show desktop commands as unified search candidates"
          git push origin HEAD:fix/desktop-command-search-31
