          assert old in text, 'scanner header anchor not found'
          text = text.replace(old, new, 1)

          start = text.index('    static func scan(hiddenSeparatorX: CGFloat, alwaysHiddenSeparatorX: CGFloat?, rtl: Bool) -> [Item] {')
