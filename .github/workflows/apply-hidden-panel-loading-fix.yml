name: Apply hidden panel loading fix

on:
  push:
    branches:
      - fix/hidden-panel-loading-stall
    paths:
      - '.github/workflows/apply-hidden-panel-loading-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/hidden-panel-loading-stall
          fetch-depth: 0

      - name: Apply source changes
        run: python3 scripts/apply_hidden_panel_loading_fix.py

      - name: Verify build and tests
        run: |
          swift test
          swift build
          python3 scripts/static_checks.py

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/OpsNotchApp/MenuBarManager.swift Sources/OpsNotchApp/MenuBarHiddenItemsPanelController.swift
          git commit -m "fix: prevent hidden panel AX scan stalls"
          git push origin HEAD:fix/hidden-panel-loading-stall
