name: Apply persistent menu bar toggle refactor

on:
  push:
    branches:
      - feat/persistent-menu-bar-toggle
    paths:
      - '.github/workflows/apply-persistent-menu-bar-toggle.yml'

permissions:
  contents: write

jobs:
  apply-refactor:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/persistent-menu-bar-toggle
          fetch-depth: 0

      - name: Apply source changes
        run: python3 scripts/apply_persistent_menu_bar_toggle.py

      - name: Verify
        run: |
          swift test
          swift build
          python3 scripts/static_checks.py

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/OpsNotchApp/MenuBarManager.swift
          git commit -m "feat: keep menu bar hidden toggle always visible"
          git push origin HEAD:feat/persistent-menu-bar-toggle
