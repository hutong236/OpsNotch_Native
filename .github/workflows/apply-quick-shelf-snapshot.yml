name: Apply Quick Shelf snapshot patch

on:
  push:
    branches:
      - fix/quick-shelf-snapshot-v284
    paths:
      - '.github/workflows/apply-quick-shelf-snapshot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/quick-shelf-snapshot-v284
          fetch-depth: 0

      - name: Patch AppModel snapshot reads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Sources/OpsNotchApp/AppModel.swift')
          text = path.read_text()

          marker = '@MainActor\nfinal class AppModel: ObservableObject {'
          snapshot_type = '''private struct QuickShelfViewSnapshot {
              let itemSnapshot: QuickShelfItemSnapshot
              let finderEntries: [QuickShelfEntry]
              let desktopEntries: [QuickShelfEntry]
              let localEntries: [QuickShelfEntry]
              let visibleEntries: [QuickShelfEntry]
              let entryByID: [String: QuickShelfEntry]
          }

          @MainActor
          final class AppModel: ObservableObject {'''
          assert marker in text
          text = text.replace(marker, snapshot_type, 1)

          old_properties = '''    @Published private(set) var items: [ShelfItem] = []
              @Published private(set) var settings = ShelfSettings()
              @Published private(set) var appContext: AppContextKind = .generic
              @Published var query = "" {
                  didSet {
                      resetQuickHighlight()
                  }
              }
              /// 类型筛选(全部/文件/文本/URL/应用),与搜索词叠加;仅会话内有效,不落盘。
              @Published var kindFilter: ShelfKindFilter = .all {
                  didSet {
                      resetQuickHighlight()
                  }
              }'''
          new_properties = '''    @Published private(set) var items: [ShelfItem] = [] {
                  didSet { invalidateQuickShelfSnapshot() }
              }
              @Published private(set) var settings = ShelfSettings() {
                  didSet { invalidateQuickShelfSnapshot() }
              }
              @Published private(set) var appContext: AppContextKind = .generic {
                  didSet { invalidateQuickShelfSnapshot() }
              }
              @Published var query = "" {
                  didSet {
                      invalidateQuickShelfSnapshot()
                      resetQuickHighlight()
                  }
              }
              /// 类型筛选(全部/文件/文本/URL/应用),与搜索词叠加;仅会话内有效,不落盘。
              @Published var kindFilter: ShelfKindFilter = .all {
                  didSet {
                      invalidateQuickShelfSnapshot()
                      resetQuickHighlight()
                  }
              }'''
          assert old_properties in text
          text = text.replace(old_properties, new_properties, 1)

          old_private = '''    private var toastWorkItem: DispatchWorkItem?
              private var lastSelectionID: UUID?
          '''
          new_private = '''    private var toastWorkItem: DispatchWorkItem?
              private var lastSelectionID: UUID?
              private var quickShelfSnapshotRevision: UInt64 = 0
              private let quickShelfSnapshotCache = QuickShelfSnapshotCache<QuickShelfViewSnapshot>()
          '''
          assert old_private in text
          text = text.replace(old_private, new_private, 1)

          start = text.index('    var workingSetItems: [ShelfItem] {')
          end = text.index('    func quickEntryID(for item: ShelfItem) -> String {')
          snapshot_block = '''    var workingSetItems: [ShelfItem] {
                  quickShelfSnapshot.itemSnapshot.working
              }

              var grouped: (pinned: [ShelfItem], recent: [ShelfItem]) {
                  let snapshot = quickShelfSnapshot.itemSnapshot
                  return (snapshot.pinned, snapshot.recent)
              }

              var visibleItems: [ShelfItem] {
                  quickShelfSnapshot.itemSnapshot.visibleItems
              }

              /// Finder 快捷路径只在“全部/文件”中出现，并与 Shelf 共用搜索框。
              var visibleFinderEntries: [QuickShelfEntry] {
                  quickShelfSnapshot.finderEntries
              }

              /// 本机文件系统搜索已移除；保留空集合用于兼容现有 Quick Shelf 视图结构。
              var visibleLocalEntries: [QuickShelfEntry] {
                  quickShelfSnapshot.localEntries
              }

              var visibleDesktopEntries: [QuickShelfEntry] {
                  quickShelfSnapshot.desktopEntries
              }

              var visibleQuickEntries: [QuickShelfEntry] {
                  quickShelfSnapshot.visibleEntries
              }

              private var quickShelfSnapshot: QuickShelfViewSnapshot {
                  quickShelfSnapshotCache.value(for: quickShelfSnapshotRevision) {
                      buildQuickShelfSnapshot()
                  }
              }

              private func buildQuickShelfSnapshot() -> QuickShelfViewSnapshot {
                  let itemSnapshot = QuickShelfItemSnapshotBuilder.build(
                      items: items,
                      workingSetItemIDs: settings.workingSetItemIDs,
                      query: query,
                      kindFilter: kindFilter,
                      appContext: appContext
                  )
                  let desktopEntries = buildVisibleDesktopEntries()
                  let finderEntries = buildVisibleFinderEntries()
                  let localEntries: [QuickShelfEntry] = []
                  let visibleEntries = desktopEntries
                      + finderEntries
                      + itemSnapshot.visibleItems.map(QuickShelfEntry.shelf)
                  let entryByID = Dictionary(uniqueKeysWithValues: visibleEntries.map { ($0.id, $0) })

                  return QuickShelfViewSnapshot(
                      itemSnapshot: itemSnapshot,
                      finderEntries: finderEntries,
                      desktopEntries: desktopEntries,
                      localEntries: localEntries,
                      visibleEntries: visibleEntries,
                      entryByID: entryByID
                  )
              }

              private func buildVisibleFinderEntries() -> [QuickShelfEntry] {
                  guard kindFilter == .all || kindFilter == .file else { return [] }

                  var entries: [QuickShelfEntry] = []
                  let defaultPath = expandedFinderPath(settings.finderDefaultPath)
                  let defaultTitle = L10n.text("finderDefaultPath", language)
                  if finderMatches(title: defaultTitle, path: defaultPath) {
                      entries.append(.finder(
                          id: QuickShelfEntry.finderDefaultID,
                          title: defaultTitle,
                          path: defaultPath,
                          quickPathID: nil
                      ))
                  }

                  for ranked in FinderQuickPathRanking.ranked(settings.finderQuickPaths) {
                      let path = expandedFinderPath(ranked.item.path)
                      guard finderMatches(title: ranked.item.label, path: path) else { continue }
                      entries.append(.finder(
                          id: QuickShelfEntry.finderID(ranked.item.id),
                          title: ranked.item.label,
                          path: path,
                          quickPathID: ranked.item.id
                      ))
                  }
                  return entries
              }

              private func buildVisibleDesktopEntries() -> [QuickShelfEntry] {
                  guard kindFilter == .all,
                        let command = DesktopCommandParser.parse(query) else { return [] }

                  switch command {
                  case .list:
                      let subtitle = language == .zhCN
                          ? "按 Enter 查看所有桌面"
                          : "Press Enter to view desktops"
                      return [.desktop(
                          id: QuickShelfEntry.desktopListID,
                          title: L10n.text("desktopList", language),
                          subtitle: subtitle,
                          command: command
                      )]
                  case .switchTo(let index):
                      let title = language == .zhCN
                          ? "切换到桌面 \\(index)"
                          : "Switch to Desktop \\(index)"
                      let subtitle = language == .zhCN
                          ? "按 Enter 执行 · d \\(index)"
                          : "Press Enter · d \\(index)"
                      return [.desktop(
                          id: QuickShelfEntry.desktopSwitchID(index),
                          title: title,
                          subtitle: subtitle,
                          command: command
                      )]
                  }
              }

              private func invalidateQuickShelfSnapshot() {
                  quickShelfSnapshotRevision &+= 1
              }

          '''
          text = text[:start] + snapshot_block + text[end:]

          old_refresh = '''    func refreshSmartContext() {
                  let next = AppContextResolver.current()
                  if appContext != next {
                      appContext = next
                      resetQuickHighlight()
                  }
              }'''
          new_refresh = '''    func refreshSmartContext() {
                  let next = AppContextResolver.current()
                  if appContext != next {
                      appContext = next
                      resetQuickHighlight()
                  } else {
                      // Ranking contains time-sensitive recency. Reopening/refocusing the Shelf
                      // starts a fresh snapshot without reintroducing a periodic timer.
                      invalidateQuickShelfSnapshot()
                  }
              }'''
          assert old_refresh in text
          text = text.replace(old_refresh, new_refresh, 1)

          old_highlight = '''    private var highlightedQuickEntry: QuickShelfEntry? {
                  guard let id = highlightedQuickEntryID else { return nil }
                  return visibleQuickEntries.first(where: { $0.id == id })
              }'''
          new_highlight = '''    private var highlightedQuickEntry: QuickShelfEntry? {
                  guard let id = highlightedQuickEntryID else { return nil }
                  return quickShelfSnapshot.entryByID[id]
              }'''
          assert old_highlight in text
          text = text.replace(old_highlight, new_highlight, 1)

          path.write_text(text)
          PY

      - name: Commit snapshot implementation and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-quick-shelf-snapshot.yml
          git add Sources/OpsNotchApp/AppModel.swift
          git commit -m "perf: reuse Quick Shelf derived snapshot"
          git push origin HEAD:fix/quick-shelf-snapshot-v284
