name: Build hidden panel test package

on:
  push:
    branches:
      - fix/hidden-panel-progressive-scan
    paths:
      - '.github/workflows/build-hidden-panel-test.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/hidden-panel-progressive-scan

      - name: Core tests
        run: swift test

      - name: Static checks
        run: python3 scripts/static_checks.py

      - name: Build test app
        run: APP_VERSION=2.7.5 scripts/build_app.sh

      - name: Verify packaged version
        shell: bash
        run: |
          set -euo pipefail
          PLIST="build/Ops Notch.app/Contents/Info.plist"
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          [[ "$ACTUAL_VERSION" == "2.7.5" ]]
          [[ "$ACTUAL_BUILD" == "275" ]]
          codesign --verify --deep --strict "build/Ops Notch.app"

      - name: Zip test app
        run: ditto -c -k --sequesterRsrc --keepParent "build/Ops Notch.app" "OpsNotch-v2.7.5-PR66-test-macOS.zip"

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: OpsNotch-v2.7.5-PR66-test-macOS
          path: OpsNotch-v2.7.5-PR66-test-macOS.zip
          retention-days: 7
