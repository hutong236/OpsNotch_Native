name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test (macOS 26)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - name: Core tests
        run: swift test

      - name: Debug build
        run: swift build

      - name: Desktop Space runtime compatibility
        run: |
          clang -std=c11 \
            -I Sources/OpsNotchPrivateInterop/include \
            Sources/OpsNotchPrivateInterop/MachOSymbolResolver.c \
            scripts/verify_desktop_space_compatibility.c \
            -framework ApplicationServices \
            -framework Foundation \
            -o "$RUNNER_TEMP/verify-desktop-space"
          "$RUNNER_TEMP/verify-desktop-space"

      - name: Architecture checks
        run: python3 scripts/static_checks.py

      - name: Bundle Finder Space demo
        run: ./script/finder_space_demo.sh --build-only

      - name: Exercise move call on demo-owned window (same Space only)
        run: |
          set -o pipefail
          dist/FinderSpaceDemo.app/Contents/MacOS/FinderSpaceDemo --probe 2>&1 | tee dist/FinderSpaceDemo-probe.log

      - name: Zip Finder Space demo
        if: always()
        run: |
          if [[ -d dist/FinderSpaceDemo.app ]]; then
            ditto -c -k --sequesterRsrc --keepParent dist/FinderSpaceDemo.app dist/FinderSpaceDemo-macOS.zip
          fi

      - name: Upload Finder Space demo and probe log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FinderSpaceDemo-macOS
          path: |
            dist/FinderSpaceDemo-macOS.zip
            dist/FinderSpaceDemo-probe.log
            Demos/FinderSpaceDemo/README.md
          if-no-files-found: warn
