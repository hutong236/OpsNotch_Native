name: Repair v2.7.10 tag

on:
  push:
    branches:
      - chore/release-v2.7.10
    paths:
      - '.github/workflows/create-v2.7.10.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Repoint v2.7.10 to functional release commit
        shell: bash
        run: |
          TAG='v2.7.10'
          TARGET='271e65f9cb1254fa9901153b41e67a7fbc30b753'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git push origin ":refs/tags/$TAG" || true
          git tag -d "$TAG" 2>/dev/null || true
          git tag -a "$TAG" "$TARGET" -m "Ops Notch $TAG"
          git push origin "$TAG"
          echo "Repaired $TAG -> $TARGET"
