name: Create v2.7.3 tag

on:
  push:
    branches:
      - chore/release-v2.7.3

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and push v2.7.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin refs/tags/v2.7.3 >/dev/null 2>&1; then
            echo "v2.7.3 already exists"
            exit 0
          fi
          git tag -a v2.7.3 127b0041f72c7cb32c81ac132b21a0b42607ac11 -m "Ops Notch v2.7.3"
          git push origin refs/tags/v2.7.3
