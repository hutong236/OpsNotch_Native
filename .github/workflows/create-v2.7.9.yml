name: Create v2.7.9 tag

on:
  push:
    branches:
      - feat/hover-intent-guard
    paths:
      - '.github/workflows/create-v2.7.9.yml'

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify release commit
        shell: bash
        run: |
          EXPECTED='8b8a76ef996bc06202d7960d5d556379df9dd220'
          ACTUAL="$(git rev-parse HEAD)"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Create and push v2.7.9
        shell: bash
        run: |
          TAG='v2.7.9'
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" 8b8a76ef996bc06202d7960d5d556379df9dd220 -m "Ops Notch $TAG"
          git push origin "$TAG"

      - name: Dispatch macOS package workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run package-app.yml --repo "$GITHUB_REPOSITORY" --ref v2.7.9
