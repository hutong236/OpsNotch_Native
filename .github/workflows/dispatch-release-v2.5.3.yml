name: Dispatch release v2.5.3

on:
  push:
    branches:
      - fix/desktop-command-search-31
    paths:
      - '.github/workflows/dispatch-release-v2.5.3.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f version=2.5.3
