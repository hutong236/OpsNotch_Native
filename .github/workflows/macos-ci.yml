name: macOS Native CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Core tests
        run: swift test
      - name: Native build
        run: swift build
      - name: Static checks
        run: python3 scripts/static_checks.py
      - name: Package app
        run: scripts/build_app.sh
