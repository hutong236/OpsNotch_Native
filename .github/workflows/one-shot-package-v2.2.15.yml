name: One-shot package v2.2.15

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-package-v2.2.15.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch package workflow for v2.2.15
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run package-app.yml --repo "$GITHUB_REPOSITORY" --ref "v2.2.15"
          echo "Dispatched package-app.yml for v2.2.15"
