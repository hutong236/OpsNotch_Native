name: Ops temporary tag v2.7.0

on:
  push:
    branches:
      - feature/menu-bar-manager-v2

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create v2.7.0 from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          MAIN_SHA="$(git rev-parse origin/main)"
          EXPECTED_SHA="5d13884fa95833002cd0e54458473da9537f2ceb"
          if [[ "$MAIN_SHA" != "$EXPECTED_SHA" ]]; then
            echo "main moved: expected=$EXPECTED_SHA actual=$MAIN_SHA"
            exit 1
          fi
          if git rev-parse -q --verify refs/tags/v2.7.0 >/dev/null; then
            echo "v2.7.0 already exists"
          else
            git tag v2.7.0 "$MAIN_SHA"
            git push origin refs/tags/v2.7.0
          fi
          sleep 2
          gh workflow run package-app.yml --ref v2.7.0
