name: Ops temporary tag v2.7.1

on:
  push:
    branches:
      - fix/menu-bar-collapse-v2.7.1

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create v2.7.1 from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          MAIN_SHA="$(git rev-parse origin/main)"
          EXPECTED_SHA="d3aabb46291f72b55753a8bc572d8a6d2424fa3d"
          if [[ "$MAIN_SHA" != "$EXPECTED_SHA" ]]; then
            echo "main moved: expected=$EXPECTED_SHA actual=$MAIN_SHA"
            exit 1
          fi
          if git rev-parse -q --verify refs/tags/v2.7.1 >/dev/null; then
            echo "v2.7.1 already exists"
          else
            git tag v2.7.1 "$MAIN_SHA"
            git push origin refs/tags/v2.7.1
          fi
          sleep 2
          gh workflow run package-app.yml --ref v2.7.1
