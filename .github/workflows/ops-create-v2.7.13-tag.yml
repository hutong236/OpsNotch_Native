name: ops create v2.7.13 tag

on:
  push:
    branches:
      - ops/release-v2.7.13

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create annotated tag on merged main commit
        shell: bash
        run: |
          TAG="v2.7.13"
          TARGET="1e39622e7a07bbace6c2eebe832df64d1309fd29"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET" -m "Ops Notch $TAG"
          git push origin "$TAG"
