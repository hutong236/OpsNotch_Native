name: macOS 打包

# 触发时机:
# 1. 推送到 main -> 构建 + 上传 Artifact(开发版构建,从 Actions 页下载)
# 2. 推送 v* 标签 -> 构建 + 创建正式 GitHub Release 附带 zip
# 3. 手动触发(Actions 页面 Run workflow)-> 构建 + 上传 Artifact
# 纯文档改动(*.md、openspec/ 等)不触发,节省构建时间。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'openspec/**'
      - '.gitignore'

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - name: Core tests
        run: swift test

      - name: Static checks
        run: python3 scripts/static_checks.py

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_VERSION="${GITHUB_REF#refs/tags/v}"
            if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: ${GITHUB_REF}"
              exit 1
            fi
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Package app
        shell: bash
        run: |
          if [[ "${{ steps.version.outputs.is_release }}" == "true" ]]; then
            APP_VERSION="${{ steps.version.outputs.version }}" scripts/build_app.sh
          else
            scripts/build_app.sh
          fi

      - name: Verify packaged version
        shell: bash
        run: |
          PLIST="build/Ops Notch.app/Contents/Info.plist"
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"

          if [[ "${{ steps.version.outputs.is_release }}" == "true" ]]; then
            EXPECTED_VERSION="${{ steps.version.outputs.version }}"
            EXPECTED_BUILD="${EXPECTED_VERSION//./}"

            echo "Tag version:      $EXPECTED_VERSION"
            echo "Packaged version: $ACTUAL_VERSION"
            echo "Packaged build:   $ACTUAL_BUILD"

            if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
              echo "Version mismatch: tag=$EXPECTED_VERSION app=$ACTUAL_VERSION"
              exit 1
            fi
            if [[ "$ACTUAL_BUILD" != "$EXPECTED_BUILD" ]]; then
              echo "Build mismatch: expected=$EXPECTED_BUILD app=$ACTUAL_BUILD"
              exit 1
            fi
          else
            echo "Development build version: $ACTUAL_VERSION ($ACTUAL_BUILD)"
          fi

      - name: Verify codesign
        run: codesign --verify --deep --strict "build/Ops Notch.app"

      - name: Zip app
        id: zip
        shell: bash
        run: |
          if [[ "${{ steps.version.outputs.is_release }}" == "true" ]]; then
            NAME="OpsNotch-v${{ steps.version.outputs.version }}-macOS"
          else
            NAME="OpsNotch-dev-$(date +%Y%m%d)-${GITHUB_SHA::7}-macOS"
          fi
          # ditto 保留签名与元数据,解压后 app 仍有效
          ditto -c -k --sequesterRsrc --keepParent "build/Ops Notch.app" "$NAME.zip"
          echo "zip_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.zip.outputs.zip_name }}
          path: ${{ steps.zip.outputs.zip_name }}.zip
          if-no-files-found: error

      # 正式版:推送 v* 标签 -> 创建带 zip 的 Release
      - name: Create release (仅标签触发)
        if: steps.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --title "Ops Notch $TAG" \
            --notes "Apple Silicon (arm64) 构建。下载 zip 解压后,首次打开请右键 App -> 打开(Ad-hoc 签名未公证)。" \
            --generate-notes \
            "${{ steps.zip.outputs.zip_name }}.zip"
