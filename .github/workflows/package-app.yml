name: macOS 打包

# 触发时机:
# 1. 推送到 main -> 构建 + 上传 Artifact + 更新滚动预发布 "latest"(开发版)
# 2. 推送 v* 标签 -> 构建 + 创建正式 GitHub Release 附带 zip
# 3. 手动触发(Actions 页面 Run workflow)-> 构建 + 上传 Artifact
# 纯文档改动(*.md、openspec/ 等)不触发,节省构建时间。
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'openspec/**'
      - '.gitignore'

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Core tests
        run: swift test

      - name: Static checks
        run: python3 scripts/static_checks.py

      - name: Package app
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # 正式版:从 v* 标签名派生版本注入产物 Info.plist(分支构建保留 Info.plist 默认值)
            APP_VERSION="${GITHUB_REF_NAME#v}" scripts/build_app.sh
          else
            scripts/build_app.sh
          fi

      - name: Verify codesign
        run: codesign --verify --deep --strict "build/Ops Notch.app"

      - name: Zip app
        id: zip
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            NAME="OpsNotch-${GITHUB_REF_NAME}-macOS"
          else
            NAME="OpsNotch-dev-$(date +%Y%m%d)-${GITHUB_SHA::7}-macOS"
          fi
          # ditto 保留签名与元数据,解压后 app 仍有效
          ditto -c -k --sequesterRsrc --keepParent "build/Ops Notch.app" "$NAME.zip"
          echo "zip_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.zip_name }}
          path: ${{ steps.zip.outputs.zip_name }}.zip
          if-no-files-found: error

      # 正式版:推送 v* 标签 -> 创建带 zip 的 Release
      - name: Create release (仅标签触发)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 先删旧 Release(保留 git 标签)再重建,标签重推/重跑时不会因 Release 已存在而失败
          gh release delete "${GITHUB_REF_NAME}" --yes 2>/dev/null || true
          gh release create "${GITHUB_REF_NAME}" \
            --title "Ops Notch ${GITHUB_REF_NAME}" \
            --notes "Apple Silicon (arm64) 构建。下载 zip 解压后,首次打开请右键 App -> 打开(Ad-hoc 签名未公证)。" \
            --generate-notes \
            "${{ steps.zip.outputs.zip_name }}.zip"

      # 开发版:每次 main 推送 -> 用新构建替换滚动预发布 "latest"
      - name: Update rolling pre-release latest (仅 main 推送)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "${{ steps.zip.outputs.zip_name }}.zip" \
            --prerelease \
            --title "Ops Notch 开发版 latest" \
            --notes "自动构建:${GITHUB_SHA::7} @ $(date +%Y-%m-%d %H:%M UTC)。随每次 main 推送自动更新,始终为最新可运行版本。Apple Silicon (arm64);首次打开请右键 App -> 打开(未公证)。"
