name: Release v2.2.11 tag

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v2.2.11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create v2.2.11 tag
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v2.2.11 >/dev/null 2>&1; then
            echo "v2.2.11 already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v2.2.11 -m "Ops Notch v2.2.11"
          git push origin v2.2.11
