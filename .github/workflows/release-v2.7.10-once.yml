name: Dispatch repaired v2.7.10 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v2.7.10-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch macOS package workflow for repaired v2.7.10
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run package-app.yml --repo "$GITHUB_REPOSITORY" --ref v2.7.10
          echo "Dispatched package-app.yml for repaired v2.7.10"
