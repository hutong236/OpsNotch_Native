name: Publish v2.7.4 release

on:
  push:
    branches:
      - chore/release-v2.7.4
    paths:
      - '.github/workflows/release-v2.7.4.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/release-v2.7.4
          fetch-depth: 0

      - name: Create v2.7.4 tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin refs/tags/v2.7.4 >/dev/null 2>&1; then
            echo "v2.7.4 already exists"
          else
            git tag -a v2.7.4 70af748f3507c3f78d474d8be46f11ea5ec829ad -m "Ops Notch v2.7.4"
            git push origin refs/tags/v2.7.4
          fi

      - name: Checkout release source
        run: git checkout v2.7.4

      - name: Core tests
        run: swift test

      - name: Static checks
        run: python3 scripts/static_checks.py

      - name: Package app
        run: APP_VERSION=2.7.4 scripts/build_app.sh

      - name: Verify packaged version
        shell: bash
        run: |
          set -euo pipefail
          PLIST="build/Ops Notch.app/Contents/Info.plist"
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          [[ "$ACTUAL_VERSION" == "2.7.4" ]]
          [[ "$ACTUAL_BUILD" == "274" ]]
          codesign --verify --deep --strict "build/Ops Notch.app"

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent "build/Ops Notch.app" "OpsNotch-v2.7.4-macOS.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v2.7.4 --yes 2>/dev/null || true
          gh release create v2.7.4 \
            --title "Ops Notch v2.7.4" \
            --notes "Apple Silicon (arm64) 构建。下载 zip 解压后,首次打开请右键 App -> 打开(Ad-hoc 签名未公证)。" \
            --generate-notes \
            "OpsNotch-v2.7.4-macOS.zip"
