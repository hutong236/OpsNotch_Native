name: One-time release v2.8.0

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'release-v2.8.0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create annotated tag on merged release commit
        shell: bash
        run: |
          TAG="v2.8.0"
          TARGET="ef5315a90c3ade192a96f06c495220a8755d10f3"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET" -m "Ops Notch $TAG"
          git push origin "$TAG"

      - name: Dispatch macOS package workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run package-app.yml --repo "$GITHUB_REPOSITORY" --ref v2.8.0
          echo "Dispatched package-app.yml for v2.8.0"
