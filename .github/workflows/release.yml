name: 创建正式版本

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，不带 v，例如 3.0.0-beta.1、3.0.0-rc.1 或 3.0.0'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version
        id: version
        shell: bash
        run: |
          python3 scripts/release_version.py "${{ inputs.version }}" --github-output "$GITHUB_OUTPUT"

      - name: Create and push tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Ops Notch $TAG"
          git push origin "$TAG"

      - name: Dispatch macOS package workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh workflow run package-app.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Dispatched package-app.yml for $TAG"
