name: Create v2.7.8 tag once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tag-v2.7.8-once.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create annotated v2.7.8 tag on merge commit
        shell: bash
        run: |
          TAG="v2.7.8"
          TARGET="8ee0a617f2fa311495cabd2608bdf55706ef7525"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET" -m "Ops Notch $TAG"
          git push origin "$TAG"
