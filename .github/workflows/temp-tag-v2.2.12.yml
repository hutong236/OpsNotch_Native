name: Temporary release v2.2.12

on:
  push:
    branches:
      - fix/clipboard-file-recapture

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify v2.2.12 target
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.2.12"
          TARGET="20af38ea683e1ecfc7cc70529a5a6c29ae21aa95"
          git fetch origin main --tags
          ACTUAL="$(git rev-list -n 1 "$TAG")"
          echo "tag=$TAG actual=$ACTUAL expected=$TARGET"
          test "$ACTUAL" = "$TARGET"

      - name: Dispatch macOS package workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run package-app.yml --repo "$GITHUB_REPOSITORY" --ref v2.2.12
          echo "Dispatched package-app.yml for v2.2.12"
