name: Dispatch v2.2.11 package

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-dispatch-v2.2.11.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch package workflow on v2.2.11
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run package-app.yml --repo "$GITHUB_REPOSITORY" --ref v2.2.11
