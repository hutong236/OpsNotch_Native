name: Temporary release v2.2.10

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create v2.2.10 tag at intended release commit
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="ba794e0380c440c045c29780a58d4a0409996c0d"
          TAG="v2.2.10"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
            exit 1
          fi
          git tag "${TAG}" "${TARGET_SHA}"
          git push origin "refs/tags/${TAG}"

      - name: Dispatch official package workflow on v2.2.10
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run package-app.yml --ref v2.2.10

      - name: Cleanup temporary workflow and branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git rm -f .github/workflows/tmp-release-v2.2.10.yml
          git commit -m "chore: remove temporary v2.2.10 release workflow"
          git push origin HEAD:main
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/ops/tag-v2.2.10" || true
